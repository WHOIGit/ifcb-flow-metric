[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ifcb-flow-metric"
version = "1.0.2"
description = "Anomaly detection toolkit for Imaging FlowCytobot (IFCB) data"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "scikit-learn",
    "tqdm",
    "matplotlib",
    "pyifcb @ git+https://github.com/joefutrelle/pyifcb@v1.2.1",
    "dash",
    "plotly",
    "requests",
    "PyYAML",
    "pandas",
    "seaborn",
    "gunicorn",
    "joblib",
    "numpy",
]

[project.urls]
Repository = "https://github.com/WHOIGit/ifcb-flow-metric"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ifcb_flow_metric"]
